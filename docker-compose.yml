services:
    # Laravel Application (Development)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: app_afroza-marketplace
        restart: unless-stopped
        ports:
            - '8000:8000'   # Laravel serve
            - '5173:5173'   # Vite HMR
            - '8080:8080'   # Reverb WebSocket
        environment:
            APP_ENV: ${APP_ENV}
            APP_DEBUG: ${APP_DEBUG}
            APP_KEY: ${APP_KEY}

            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}

            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
            AWS_BUCKET: ${AWS_BUCKET}
            AWS_ENDPOINT: http://minio:9000
            AWS_USE_PATH_STYLE_ENDPOINT: true

            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            QUEUE_CONNECTION: redis
        depends_on:
            - postgres
            - minio
            - redis
        networks:
            - afroza-marketplace

    # Nginx (Production)
    nginx:
        image: nginx:alpine
        container_name: nginx_afroza-marketplace
        restart: unless-stopped
        ports:
            - '80:80'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/www/html:ro
        depends_on:
            - app
        profiles:
            - production
        networks:
            - afroza-marketplace

    # Redis for cache/sessions/queues
    redis:
        image: redis:alpine
        container_name: redis_afroza-marketplace
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        networks:
            - afroza-marketplace

    adminer:
        image: adminer
        container_name: adminer_afroza-marketplace
        restart: always
        ports:
            - 8081:8080
        networks:
            - afroza-marketplace

    postgres:
        image: postgres:latest
        container_name: postgres_afroza-marketplace
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - 'postgres_data:/var/lib/postgresql/data'
        networks:
            - afroza-marketplace

    minio:
        image: 'minio/minio:latest'
        container_name: minio_afroza-marketplace
        ports:
            - '9000:9000'
            - '9002:9001'
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"
        networks:
            - afroza-marketplace

networks:
    afroza-marketplace:
        driver: bridge

volumes:
    postgres_data:
    minio_data:
    redis_data:
