services:
    adminer:
        image: adminer
        container_name: adminer_vide-dressing
        restart: always
        ports:
            - 8080:8080
    postgres:
        image: postgres:latest
        container_name: postgres_vide-dressing
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: db_vide-dressing
            POSTGRES_USER: jedidia
            POSTGRES_PASSWORD: Jed@@25!!
        volumes:
            - 'postgres_data:/var/lib/postgresql/data'
    minio:
        image: 'minio/minio:latest'
        container_name: minio_vide-dressing
        ports:
            - '9000:9000'
            - '9002:9001'
        environment:
            MINIO_ROOT_USER: jedidia
            MINIO_ROOT_PASSWORD: Jed@@25!!
        volumes:
            - minio_data:/data
#            - minio_config:/root/.minio
        command: server /data --console-address ":9001"
volumes:
    postgres_data:
    minio_data:
